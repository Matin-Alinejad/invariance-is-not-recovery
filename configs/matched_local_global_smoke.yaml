# Reduced executable check of the dedicated target-local recovery branch.
output_dir: results/matched_local_global_smoke
base:
  seeds:
  - 0
  target_sampling: stratified_degree
  targets_per_graph: 4
  min_effective_samples: 10
  insufficient_policy: keep_edge
  max_conditioning_set_size: 3
  mask_variables: all
  masking_slope: 1.0
  quadratic_a: 0.2
  noise_distribution: gaussian
  reference_p: 50
  reference_n_over_p: 50
  local_search_method: pc_simple_heuristic
  oracle_query_diagnostics_max_p: 20
topologies:
- name: random_regular_d2
  enum: random_regular
  params:
    degree: 2
p_grid:
- 20
sample_scaling:
  gammas:
  - 1.0
ci_tests:
- pearson
alpha_schedules:
- n_inverse_half
sem_models:
- linear
signal_ranges:
- - 0.5
  - 1.0
missingness_modes:
- complete
- self_masking_gaussian_preserving
- self_masking_logistic_population
missing_rates:
- 0.0
- 0.3
masking_slopes:
- 1.0
